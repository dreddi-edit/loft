services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hair_simo
      TZ: Europe/Rome
      PGTZ: Europe/Rome
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hair_simo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - hair_simo_pg:/var/lib/postgresql/data

volumes:
  hair_simo_pg:
