services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hair_simo
    volumes:
      - hair_simo_pg:/var/lib/postgresql/data

volumes:
  hair_simo_pg:
