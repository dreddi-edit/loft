name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hair_simo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hair_simo
      JWT_SECRET: ci-test-secret-min-32-chars-long
      SEED_ADMIN_PASSWORD: ci-seed-password-min-12-chars
      ADMIN_OWNER_EMAIL: simona@hairsimo.it
      PAYMENTS_MOCK_ENABLED: "true"
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose — pnpm/action-setup@v4 reads the pinned
      # version from the root package.json `packageManager` field and errors out
      # if both are given and disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm db:setup` is the local-dev entrypoint: it boots Postgres via docker
      # compose, which collides with the service container above. In CI the database
      # is already running, so drive Prisma directly.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database schema
        run: pnpm db:push

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
